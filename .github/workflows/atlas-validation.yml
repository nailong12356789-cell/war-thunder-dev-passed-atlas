name: Validate Atlas
on:
  push:
    paths:
      - 'index.html'
      - 'data/vehicles.json'
      - 'scripts/validate_atlas.py'
      - '.github/workflows/atlas-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'data/vehicles.json'
      - 'scripts/validate_atlas.py'
      - '.github/workflows/atlas-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML / JSON consistency
        run: python3 scripts/validate_atlas.py
