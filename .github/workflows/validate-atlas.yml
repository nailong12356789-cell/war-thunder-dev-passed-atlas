name: Validate atlas dataset
on:
  push:
    paths:
      - index.html
      - data/vehicles.json
      - src/app.js
      - tools/sync-app.js
      - package.json
      - scripts/validate_atlas.py
      - .github/workflows/validate-atlas.yml
  pull_request:
    paths:
      - index.html
      - data/vehicles.json
      - src/app.js
      - tools/sync-app.js
      - package.json
      - scripts/validate_atlas.py
      - .github/workflows/validate-atlas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bilingual app JavaScript syntax
        run: node --check src/app.js && node --check tools/sync-app.js
      - name: Validate offline dataset and published HTML
        run: python scripts/validate_atlas.py
